<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMA Gather4 Benchmark Visualizer</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #ffffff; --surface: #f6f8fa; --border: #d1d9e0;
    --text: #1f2328; --muted: #656d76; --accent: #0969da;
    --green: #1a7f37; --orange: #9a6700; --red: #d1242f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }

  .layout { display: grid; grid-template-columns: 340px 1fr; height: 100vh; }
  .sidebar { background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .main { overflow-y: auto; padding: 24px; }

  h1 { font-size: 15px; font-weight: 600; color: var(--text); }
  h2 { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; font-weight: 600; }

  textarea {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 11px; resize: vertical; height: 140px;
  }
  textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(9,105,218,0.15); }

  button {
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
    padding: 7px 14px; font-size: 13px; cursor: pointer; font-weight: 500;
  }
  button:hover { opacity: 0.9; }
  button.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }

  .experiment-list { display: flex; flex-direction: column; gap: 4px; flex: 1; overflow-y: auto; }
  .exp-item {
    padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 13px;
    border: 1px solid transparent; transition: all 0.1s;
  }
  .exp-item:hover { background: var(--bg); border-color: var(--border); }
  .exp-item .name { font-weight: 500; font-size: 12px; }
  .exp-item .meta { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .chart-section { margin-bottom: 36px; }
  .chart-section h3 { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .chart-section .info { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .chart-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; height: 340px; }

  .stats-row { display: flex; gap: 16px; margin-bottom: 8px; flex-wrap: wrap; }
  .stat { font-size: 12px; color: var(--muted); }
  .stat b { color: var(--text); }

  .empty-state { display: flex; align-items: center; justify-content: center; height: 60vh; color: var(--muted); font-size: 14px; text-align: center; line-height: 1.8; }

  .y-toggle { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
  .y-toggle button { font-size: 11px; padding: 3px 10px; border-radius: 12px; }
  .y-toggle button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
</style>
</head>
<body>
<div class="layout">
  <div class="sidebar">
    <h1>Benchmark Visualizer</h1>

    <div>
      <h2>CSV Data</h2>
      <textarea id="csv-input" placeholder="Paste benchmark CSV here..."></textarea>
      <div style="display:flex;gap:6px;margin-top:6px">
        <button onclick="parseAndRender()">Render</button>
        <button class="secondary" onclick="loadFile()">Load File</button>
      </div>
    </div>

    <div style="flex:1;display:flex;flex-direction:column;min-height:0">
      <h2>Experiments</h2>
      <div id="experiment-list" class="experiment-list"></div>
    </div>
  </div>

  <div class="main" id="charts-area">
    <div class="empty-state">
      Paste CSV data and click <b>Render</b>,<br>
      or click <b>Load File</b> to browse.
    </div>
  </div>
</div>

<script>
const COLORS = ['#0969da','#1a7f37','#9a6700','#d1242f','#8250df','#bf3989','#0550ae','#953800','#1b7c83','#57606a'];
const Y_METRICS = ['throughput_GBps', 'avg_latency_ns', 'net_latency_ns'];
// Columns that are derived from x_var or are measurement outputs — never auto-series
const IGNORE_FOR_SERIES = new Set([
  'experiment', 'x_var', 'throughput_GBps', 'avg_latency_ns', 'net_latency_ns',
  'spread_pct', 'num_iters', 'n_outstanding',
  // derived from box/dtype changes
  'bytes_per_row', 'bytes_per_gather4', 'col_steps',
]);

let parsedRows = [];
let experiments = [];  // [{name, x_var, rows, seriesCol}]
let chartInstances = {};
let activeY = 'throughput_GBps';

function parseCSV(text) {
  const lines = text.trim().split('\n').filter(l => l.trim());
  if (lines.length < 2) return [];
  const headers = lines[0].split(',').map(h => h.trim());
  return lines.slice(1).map(line => {
    const vals = line.split(',');
    if (vals.length !== headers.length) return null;
    const row = {};
    headers.forEach((h, j) => {
      const v = vals[j].trim();
      row[h] = v === '' ? null : (isNaN(Number(v)) ? v : Number(v));
    });
    return row;
  }).filter(Boolean);
}

function discoverExperiments(rows) {
  const grouped = {};
  rows.forEach(r => {
    const key = r.experiment;
    if (!key) return;
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(r);
  });

  return Object.entries(grouped).map(([name, expRows]) => {
    const x_var = expRows[0].x_var || '';

    // Auto-detect series: find columns that vary across rows, excluding x_var, metrics, and derived
    const headers = Object.keys(expRows[0]);
    const varyingCols = headers.filter(h => {
      if (h === x_var) return false;
      if (IGNORE_FOR_SERIES.has(h)) return false;
      const vals = new Set(expRows.map(r => String(r[h])));
      return vals.size > 1;
    });

    // Pick series column: prefer the one with fewest unique values (cleaner legend)
    let seriesCol = null;
    if (varyingCols.length === 1) {
      seriesCol = varyingCols[0];
    } else if (varyingCols.length > 1) {
      // Pick column with smallest cardinality
      seriesCol = varyingCols.reduce((best, col) => {
        const n = new Set(expRows.map(r => r[col])).size;
        const bestN = new Set(expRows.map(r => r[best])).size;
        return n < bestN ? col : best;
      });
    }

    return { name, x_var, rows: expRows, seriesCol };
  });
}

function buildChartData(exp, yField) {
  const rows = exp.rows.filter(r => r[yField] != null);
  if (!rows.length) return null;

  const xVals = [...new Set(rows.map(r => r[exp.x_var]))];

  if (!exp.seriesCol) {
    return {
      labels: xVals.map(String),
      datasets: [{
        label: yField,
        data: xVals.map(xv => { const r = rows.find(r => r[exp.x_var] === xv); return r ? r[yField] : null; }),
        borderColor: COLORS[0], backgroundColor: COLORS[0] + '18',
        borderWidth: 2, pointRadius: 4, pointHoverRadius: 6, tension: 0.15,
      }]
    };
  }

  const seriesVals = [...new Set(rows.map(r => r[exp.seriesCol]))];
  return {
    labels: xVals.map(String),
    datasets: seriesVals.map((sv, i) => {
      const sRows = rows.filter(r => r[exp.seriesCol] === sv);
      return {
        label: String(sv),
        data: xVals.map(xv => { const r = sRows.find(r => r[exp.x_var] === xv); return r ? r[yField] : null; }),
        borderColor: COLORS[i % COLORS.length], backgroundColor: COLORS[i % COLORS.length] + '18',
        borderWidth: 2, pointRadius: 4, pointHoverRadius: 6, tension: 0.15,
      };
    })
  };
}

function renderChart(canvasId, exp, yField) {
  const data = buildChartData(exp, yField);
  if (!data) return;
  if (chartInstances[canvasId]) chartInstances[canvasId].destroy();

  const canvas = document.getElementById(canvasId);
  if (!canvas) return;

  chartInstances[canvasId] = new Chart(canvas, {
    type: 'line',
    data,
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          display: data.datasets.length > 1,
          labels: { color: '#656d76', font: { size: 11 } }
        },
        tooltip: {
          backgroundColor: '#fff', titleColor: '#1f2328', bodyColor: '#1f2328',
          borderColor: '#d1d9e0', borderWidth: 1,
          titleFont: { size: 12 }, bodyFont: { size: 12 },
          callbacks: { label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y != null ? ctx.parsed.y.toFixed(2) : 'N/A'}` }
        }
      },
      scales: {
        x: {
          title: { display: true, text: exp.x_var, color: '#656d76', font: { size: 12 } },
          ticks: { color: '#656d76', font: { size: 11 } },
          grid: { color: '#f0f0f0' },
        },
        y: {
          title: { display: true, text: yField, color: '#656d76', font: { size: 12 } },
          ticks: { color: '#656d76', font: { size: 11 } },
          grid: { color: '#f0f0f0' },
          beginAtZero: false,
        }
      }
    }
  });
}

function renderSidebar() {
  const list = document.getElementById('experiment-list');
  list.innerHTML = '';
  experiments.forEach((exp, i) => {
    const item = document.createElement('div');
    item.className = 'exp-item';
    item.innerHTML = `
      <div class="name">${exp.name}</div>
      <div class="meta">x: ${exp.x_var}${exp.seriesCol ? ' &middot; series: ' + exp.seriesCol : ''} &middot; ${exp.rows.length} rows</div>
    `;
    item.addEventListener('click', () => {
      const el = document.getElementById(`section-${i}`);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    list.appendChild(item);
  });
}

function renderAllCharts() {
  const area = document.getElementById('charts-area');
  Object.values(chartInstances).forEach(c => c.destroy());
  chartInstances = {};

  if (!experiments.length) {
    area.innerHTML = '<div class="empty-state">No experiments found in CSV data.</div>';
    return;
  }

  // Y metric toggle
  let html = '<div class="y-toggle">';
  Y_METRICS.forEach(m => {
    html += `<button class="secondary${m === activeY ? ' active' : ''}" onclick="setY('${m}')">${m}</button>`;
  });
  html += '</div>';
  area.innerHTML = html;

  experiments.forEach((exp, i) => {
    // Check if this y metric has data
    const hasData = exp.rows.some(r => r[activeY] != null);
    if (!hasData) return;

    const yVals = exp.rows.map(r => r[activeY]).filter(v => v != null);
    const min = Math.min(...yVals).toFixed(2);
    const max = Math.max(...yVals).toFixed(2);

    const section = document.createElement('div');
    section.className = 'chart-section';
    section.id = `section-${i}`;
    section.innerHTML = `
      <h3>${exp.name}</h3>
      <div class="info">x: ${exp.x_var}${exp.seriesCol ? ' &middot; series: ' + exp.seriesCol : ''}</div>
      <div class="stats-row">
        <span class="stat">min: <b>${min}</b></span>
        <span class="stat">max: <b>${max}</b></span>
        <span class="stat">rows: <b>${exp.rows.length}</b></span>
      </div>
      <div class="chart-wrap"><canvas id="chart-${i}"></canvas></div>
    `;
    area.appendChild(section);
    renderChart(`chart-${i}`, exp, activeY);
  });
}

function setY(metric) {
  activeY = metric;
  renderAllCharts();
}

function parseAndRender() {
  parsedRows = parseCSV(document.getElementById('csv-input').value);
  experiments = discoverExperiments(parsedRows);
  renderSidebar();
  renderAllCharts();
}

function loadFile() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.csv';
  input.onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = ev => { document.getElementById('csv-input').value = ev.target.result; parseAndRender(); };
    reader.readAsText(f);
  };
  input.click();
}
</script>
</body>
</html>
